name: Shadowfall 3D Assets

on:
  push:
    branches: [main]
    paths:
      - 'blender/**'
      - '.github/workflows/shadowfall-assets.yml'
      - 'public/assets/3d/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version

      - name: Generate GLB assets
        run: blender --background --python blender/generate_shadowfall_assets.py

      - name: Validate GLB assets
        run: blender --background --python blender/validate_shadowfall_assets.py

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets/3d/*.glb
          if git diff --cached --quiet; then
            echo 'No asset changes.'
            exit 0
          fi
          git commit -m 'build: generate validated Shadowfall GLB assets'
          git push
